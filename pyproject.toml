[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmae-tabular-imputation"
version = "1.0.0"
description = "Proportionally Masked Autoencoders for tabular data imputation"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<3.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "einops>=0.7",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0", "ipykernel>=6.25", "matplotlib>=3.7"]

[project.scripts]
pmae-experiment = "pmae_tabular.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
